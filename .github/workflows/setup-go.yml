name: Setup Go with tool-versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-go:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-24-04
          - ubuntu-24-04-arm
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go from .tool-versions
        uses: actions/setup-go@v6
        with:
          go-version-file: '.tool-versions'

      - name: Verify Go installation
        run: |
          go version
          echo "Go installed successfully!"
